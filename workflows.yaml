task_format: TASK-{digit}

modes:
  - name: economy
    description:
      - Use as few tokens as possible.
      - Use concise descriptions and lighter reasoning where appropriate.

handlers:
  - update-architecture-documentation: Update documentation/architecture.md file with changes over architecture.

  - update-readme: "Update README.md file with high-level ww-related information: the purpose of the tool, some main examples, instructions how to setup, etc. This document is not about architecture and all the features, it's an introductory document."

  - update-feature-documentation: "Update documentation/features.md file with new/updated/deleted feature. This document should be split-by-feature with examples."

  - update-yaml-specification: Update documentation/specification.md file with updated specification/syntax of workflows.yaml file.

  - update-ww-agent-instructions-file: "Update AGENTS.md file with changed instructions for agents on how to invoke ww."

hooks:
  before_start_workflow:
    - workflows: [ 'task', 'bugfix' ]
      handlers:
        - ext/ww/git/handlers:is-git-clean: ~
        - ext/ww/git/handlers:start-task-branch: ~
        - ext/ww/git/handlers:create-worktree: ~

  before_complete_workflow:
    - workflows: [ 'task', 'bugfix' ]
      handlers:
        - update-architecture-documentation: ~
        - update-readme: ~
        - update-feature-documentation: ~
        - update-yaml-specification: ~
        - ext/ww/git/handlers:git-commit: ~

workflows:
  - task: ~
    steps:
      - develop: Perform a research, make analysis, and develop the requested task. Do not run tests or any lints - this will be one of the next steps.
        subagents: false

      - run-tests:
        model: cheapest
        reasoning: lowest
        loop:
          - test: Run all existing tests via pytest in the least verbose mode and immediately fix the failed ones.
            break: When all the tests pass.

      - check-code-quality:
        model: cheapest
        reasoning: lowest
        loop:
          - run: Run mypy and ruff to check for code style, and other code-mess-related issues, in the least verbose mode, and immediately fix the found issues.
            break: When there are no issues found from these tools anymore.

  - bugfix: ~
    steps:
      - investigate: Perform an investigation to understand why and under which circumstances the bug appears.
      - fix: Perform the fix based on the findings of investigation.
      - run-tests:
        loop:
          - test: Run all existing tests via pytest in the least verbose mode (but so you would see issues in case there are),
            break: When all the tests pass.
          - fix: Fix all found failed tests.
            depends_on: test
          - check-code-quality:
            loop:
              - run: Run mypy and ruff to check for code style, and other code-mess-related issues, in the least verbose mode (but so you would see issues in case there are).
                break: When there are no issues found from these tools anymore.
              - fix: Fix all findings of code checks.
                depends_on: run

  - auto-refactor: This workflow is intended to perform automatic refactoring after the recent development. An advice is to run this periodically to review and reshape the architecture.
    steps:
      - reason: Check if the recent development is meaningful enough to consider making the refactoring. Analyze the recent code changes and try to detect code-smells and architectural issues - these are the decisive factors for proceeding with this workflow. To detect the recent development you may use the timestamp of the latest auto-refactoring saved in metadata - {{project_metadata.last_auto_refactored_at}} (if empty, no auto refactoring has been ran yet).
      - plan: Make a detailed plan of the refactoring points.
      - refactor: ~
        update_metadata:
          - last_auto_refactored_at: "Save the current timestamp in format YYYY-MM-DD HH:mm"
            key: last_auto_refactored_at
            scope: project
