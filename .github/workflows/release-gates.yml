name: Release gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-and-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep the declared minimum executable, alongside the primary CI runtime.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src/ww tests scripts/check_release_gates.py
      - run: python -m mypy
      - run: python scripts/check_release_gates.py
      - run: python -m pytest
      # Build, inspect, and install artifacts without the source checkout on sys.path.
      - run: python scripts/check_distribution.py
