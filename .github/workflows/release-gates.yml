name: Release gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-and-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep the declared minimum executable, alongside the primary CI runtime.
        python-version: ["3.10", "3.12"]
    steps:
      # Pinned to commits, not tags: a tag can be repointed at new code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src/ww tests scripts/check_release_gates.py
      - run: python -m mypy
      - run: python scripts/check_release_gates.py
      - run: python -m pytest
      # Build, inspect, and install artifacts without the source checkout on sys.path.
      - run: python scripts/check_distribution.py
      # One runtime dependency and a few dev tools, but the answer to
      # "is any of it known-vulnerable?" should be checked every run,
      # not when someone thinks to ask. Skips the editable project itself.
      - name: Audit dependencies for known vulnerabilities
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install pip-audit
          pip-audit --skip-editable --strict
